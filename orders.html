<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orders</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; background: #faf7f2; color: #2b2118; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; background: #6b3f1d; color: #fff; }
  header h1 { margin: 0; font-size: 20px; }
  header button { border: 1px solid #fff8; border-radius: 8px; background: none; color: #fff; padding: 6px 12px; cursor: pointer; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 60px; }
  #login { max-width: 360px; margin: 48px auto; padding: 0 16px; }
  #login input { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; font-size: 16px; border: 1px solid #c9bba8; border-radius: 8px; }
  .btn { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #1b8f49; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .err { color: #8e2a20; min-height: 1.3em; margin: 6px 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .filters button { padding: 8px 14px; border: 0; border-radius: 999px; background: #e8dfd3; font-size: 14px; cursor: pointer; }
  .filters button.on { background: #6b3f1d; color: #fff; }
  .card { background: #fff; border: 1px solid #c9bba8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card.s-open { border-left: 6px solid #c0392b; }
  .card.s-picked { border-left: 6px solid #d68910; }
  .card.s-in_progress { border-left: 6px solid #2e86c1; }
  .card.s-ready { border-left: 6px solid #1b8f49; }
  .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .muted { color: #6f5f4d; font-size: 13px; }
  ul { margin: 8px 0; padding-inline-start: 18px; }
  li small { display: block; color: #6f5f4d; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .steps button { flex: 1 1 auto; padding: 10px 8px; border: 1px solid #c9bba8; border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer; min-width: 90px; }
  .steps button.cur { background: #6b3f1d; color: #fff; border-color: #6b3f1d; }
  .steps button.cancel { color: #8e2a20; }
  .steps button:disabled { opacity: .6; cursor: wait; }
  .empty { text-align: center; color: #6f5f4d; margin: 40px 0; }
  .top { cursor: pointer; }
  .link { border: 0; background: none; color: #6b3f1d; text-decoration: underline; font-size: 14px; padding: 4px 0; cursor: pointer; }
  #detail { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  #detail[hidden] { display: none; }
  #dpanel { background: #faf7f2; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; box-sizing: border-box; }
  #dpanel h2 { margin: 0 0 4px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: #6f5f4d; vertical-align: middle; }
  .chip.open { background: #c0392b; } .chip.picked { background: #d68910; } .chip.in_progress { background: #2e86c1; } .chip.ready { background: #1b8f49; } .chip.cancelled { background: #8e2a20; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted #c9bba8; }
  .kv span:first-child { color: #6f5f4d; }
  .kv span:last-child { text-align: end; overflow-wrap: anywhere; }
  .kv.total { font-weight: 800; font-size: 18px; border-bottom: 0; }
  .kv.save span:last-child { color: #1b7a43; font-weight: 600; }
  #dpanel h3 { margin: 14px 0 4px; font-size: 15px; }
  .danger { width: 100%; padding: 12px; margin-top: 12px; border: 1px solid #c0392b; border-radius: 10px; background: #fff; color: #8e2a20; font-size: 16px; font-weight: 600; cursor: pointer; }
  .danger:disabled { opacity: .6; cursor: wait; }
  .closebtn { width: 100%; padding: 12px; margin-top: 8px; border: 0; background: none; color: #6f5f4d; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<header><h1>Orders</h1><button id="out" hidden>Sign out</button></header>

<form id="login">
  <h2>Staff sign in</h2>
  <input id="u" placeholder="Username" autocomplete="username" required>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <div class="err" id="loginErr"></div>
  <button class="btn" type="submit">Sign in</button>
</form>

<main id="app" hidden>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <p class="muted" id="stamp"></p>
</main>

<div id="detail" hidden><div id="dpanel" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script>
// Address of the backend: from config.js; for testing ?api=... overrides it (and is remembered on this device).
const params = new URLSearchParams(location.search);
const mem = {
  get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch { return null; } },
  set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch {} },
  del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch {} }
};
if (params.get("api")) mem.set("apiUrl", params.get("api").replace(/\/+$/, ""));
const API = (params.get("api") || window.MENU_API || mem.get("apiUrl") || "http://localhost:3000").replace(/\/+$/, "");

const STATUS = [["open", "Open"], ["picked", "Picked"], ["in_progress", "In progress"], ["ready", "Ready for pickup"]];
const NAMES = Object.fromEntries([...STATUS, ["cancelled", "Cancelled"]]);
const TYPES = { dinein: "Dine in", takeaway: "Takeaway", delivery: "Delivery" };
const FILTERS = [["active", "Active"], ["ready", "Ready"], ["cancelled", "Cancelled"], ["all", "All"]];

let token = mem.get("ordersToken", true);   // kept only while this tab is open
let filter = "active", orders = [], busy = new Set(), openNo = null;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const money = n => Number(n).toFixed(2);

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { signedOut("Please sign in again."); throw new Error("signed out"); }
  if (!res.ok) throw new Error(body.error || "Something went wrong");
  return body;
}

function signedOut(msg = "") {
  token = null; mem.del("ordersToken", true); closeDetail();
  $("login").hidden = false; $("app").hidden = true; $("out").hidden = true;
  $("loginErr").textContent = msg;
}

$("login").onsubmit = async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    const s = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    token = s.token; mem.set("ordersToken", token, true);
    $("p").value = "";
    start();
  } catch (err) {
    $("loginErr").textContent = err.message === "Failed to fetch" ? "Cannot reach the server." : err.message;
  }
};

$("out").onclick = async () => { try { await api("/api/auth/logout", { method: "POST" }); } catch {} signedOut(); };

function start() {
  $("login").hidden = true; $("app").hidden = false; $("out").hidden = false;
  load();
}

async function load() {
  if (!token) return;
  try {
    orders = await api("/api/orders");
    $("stamp").textContent = "Updated " + new Date().toLocaleTimeString();
    render();
    if (openNo != null) renderDetail();
  } catch (e) { if (e.message !== "signed out") $("stamp").textContent = "Cannot reach the server. Retrying..."; }
}

const isActive = o => ["open", "picked", "in_progress"].includes(o.status);   // still to be made
const shown = () => orders.filter(o => filter === "all" || (filter === "active" ? isActive(o) : o.status === filter))
  .sort((a, b) => filter === "active" ? new Date(a.created_at) - new Date(b.created_at) : new Date(b.created_at) - new Date(a.created_at));

function render() {
  const f = $("filters"); f.innerHTML = "";
  for (const [key, label] of FILTERS) {
    const n = orders.filter(o => key === "all" || (key === "active" ? isActive(o) : o.status === key)).length;
    const b = el("button", key === filter ? "on" : "", `${label} (${n})`);
    b.onclick = () => { filter = key; render(); };
    f.appendChild(b);
  }
  const list = $("list"); list.innerHTML = "";
  const rows = shown();
  if (!rows.length) list.appendChild(el("div", "empty", "No orders here."));
  for (const o of rows) list.appendChild(card(o));
}

function card(o) {
  const c = el("div", "card s-" + o.status);
  const top = el("div", "top");
  top.title = "Show order details";
  top.onclick = () => showDetail(o.number);
  top.append(el("span", "", `#${o.number} - ${o.customer}`), el("span", "", "$" + money(o.total)));
  const when = new Date(o.created_at);
  const where = o.type === "dinein" ? ` - table ${o.table_no}` : o.type === "delivery" ? ` - ${o.phone}` : "";
  c.append(top, el("div", "muted", `${TYPES[o.type]}${where} - ${when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} - ${NAMES[o.status]}`));
  if (o.type === "delivery") c.append(el("div", "muted", [o.area, o.address].filter(Boolean).join(", ")));
  const ul = el("ul");
  for (const i of o.items) {
    const li = el("li", "", `${i.qty} x ${i.name}`);
    if (i.parts) li.append(el("small", "", i.parts));
    if (i.note) li.append(el("small", "", "> " + i.note));
    ul.appendChild(li);
  }
  c.appendChild(ul);
  if (o.note) c.append(el("div", "muted", "Note: " + o.note));
  const more = el("button", "link", "View details");
  more.onclick = () => showDetail(o.number);
  c.appendChild(more);
  const steps = el("div", "steps");
  for (const [key, label] of [...STATUS.map(([k, l]) => [k, k === "ready" ? "Ready" : l]), ["cancelled", "Cancel"]]) {
    const b = el("button", (key === o.status ? "cur " : "") + (key === "cancelled" ? "cancel" : ""), label);
    b.disabled = busy.has(o.number);
    b.onclick = () => setStatus(o, key);
    steps.appendChild(b);
  }
  c.appendChild(steps);
  return c;
}

async function setStatus(o, status) {
  if (o.status === status) return;
  if (status === "cancelled" && !confirm(`Cancel order #${o.number}?`)) return;
  busy.add(o.number); render(); if (openNo != null) renderDetail();
  try {
    await api(`/api/orders/${o.number}/status`, { method: "PATCH", body: JSON.stringify({ status }) });
    o.status = status;
  } catch (e) { if (e.message !== "signed out") alert(e.message); }
  busy.delete(o.number); render(); if (openNo != null) renderDetail();
}

// ---- Order details ----
const ago = d => { const m = Math.max(0, Math.round((Date.now() - new Date(d)) / 60000)); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };

function showDetail(number) { openNo = number; renderDetail(); }
function closeDetail() { openNo = null; $("detail").hidden = true; }
$("detail").onclick = e => { if (e.target === $("detail")) closeDetail(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

function renderDetail() {
  const o = orders.find(x => x.number === openNo);
  const p = $("dpanel");
  if (!o) return closeDetail();
  $("detail").hidden = false;
  p.innerHTML = "";
  const h = el("h2", "", `Order #${o.number} `);
  h.append(el("span", "chip " + o.status, NAMES[o.status]));
  p.appendChild(h);
  const kv = (k, v, cls = "") => { const r = el("div", "kv " + cls); r.append(el("span", "", k), el("span", "", v)); p.appendChild(r); };
  kv("Placed", `${new Date(o.created_at).toLocaleString()} (${ago(o.created_at)})`);
  kv("Type", TYPES[o.type]);
  kv("Customer", o.customer);
  if (o.table_no) kv("Table", o.table_no);
  if (o.phone) kv("Phone", o.phone);
  if (o.area) kv("Area", o.area);
  if (o.address) kv("Address", o.address);
  if (o.note) kv("Note", o.note);

  p.appendChild(el("h3", "", "Items"));
  for (const i of o.items) {
    const r = el("div", "kv");
    const left = el("span", "", `${i.qty} x ${i.name}`);
    if (i.parts) left.append(el("small", "muted", i.parts));
    if (i.note) left.append(el("small", "muted", "> " + i.note));
    left.querySelectorAll("small").forEach(s => { s.style.display = "block"; });
    r.append(left, el("span", "", `$${money(i.qty * i.unitPrice)}`));
    p.appendChild(r);
  }
  kv("Subtotal", "$" + money(o.subtotal));
  if (o.type === "delivery") kv("Delivery fee", Number(o.delivery_fee) ? "$" + money(o.delivery_fee) : "Free");
  if (Number(o.savings) > 0) kv("Saved with combos", "$" + money(o.savings), "save");
  kv("Total", "$" + money(o.total), "total");

  if (o.status !== "cancelled") {
    const cancel = el("button", "danger", "Cancel this order");
    cancel.disabled = busy.has(o.number);
    cancel.onclick = () => setStatus(o, "cancelled");
    p.appendChild(cancel);
  } else {
    const back = el("button", "danger", "Restore order (set to Open)");
    back.disabled = busy.has(o.number);
    back.onclick = () => setStatus(o, "open");
    p.appendChild(back);
  }
  const close = el("button", "closebtn", "Close");
  close.onclick = closeDetail;
  p.appendChild(close);
}

setInterval(load, 10000);
if (token) start();
</script>
</body>
</html>
