<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu QR Codes</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 16px; background: #faf7f2; color: #2b2118; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; }
  .cards { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 24px; }
  .card { background: #fff; padding: 16px; border-radius: 12px; text-align: center; }
  .qr { display: inline-block; padding: 8px; background: #fff; }
  button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
  .note { color: #7a6a58; font-size: 14px; }
  .tables .card { width: 200px; }
  .tables .card h3 { margin: 0 0 8px; font-size: 22px; }
  @media print {
    body { background: #fff; padding: 0; }
    .noprint, body > h1, body > p, body > label, body > input, .tables .card button { display: none !important; }
    .tables { margin: 0; gap: 16px; }
    .tables .card { break-inside: avoid; border: 1px solid #ccc; }
  }
</style>
</head>
<body>
<h1>Menu QR Codes</h1>
<p class="note">Paste the public URL where <code>menu.html</code> is hosted (the QR must point to a web address phones can reach, not a local file).</p>
<label for="base">Menu page URL</label>
<input id="base" placeholder="https://your-site.com/menu.html">

<label for="tableNo">Table number (optional, prints a table-specific QR)</label>
<input id="tableNo" placeholder="e.g. 5" inputmode="numeric">

<div class="cards noprint">
  <div class="card"><h3>Restaurant + Coffee Shop</h3><div class="qr" id="qr-menu"></div><br><button data-id="menu">Download PNG</button></div>
</div>

<div class="noprint">
  <h2>Table QR codes</h2>
  <p class="note">One code per table. Scanning opens the menu with <b>Dine in</b> and the table number already filled in.</p>
  <label for="tableCount">How many tables?</label>
  <input id="tableCount" type="number" min="1" max="200" placeholder="e.g. 10">
  <button id="makeTables">Create table codes</button>
  <button id="printTables" hidden>Print / Save as PDF</button>
</div>
<div class="cards tables" id="tables"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const base = document.getElementById("base");
const targets = { menu: "" };   // one QR opens the menu with both tabs
const saved = (() => { try { return localStorage.getItem("menuUrl"); } catch { return null; } })();
base.value = saved || (location.protocol.startsWith("http") ? new URL("menu.html", location.href).href : "https://adhamatare.github.io/test/menu.html");

function render() {
  try { localStorage.setItem("menuUrl", base.value); } catch {}
  for (const [id, tab] of Object.entries(targets)) {
    const el = document.getElementById("qr-" + id);
    el.innerHTML = "";
    if (!base.value) continue;
    let u;
    try { u = new URL(base.value.split("#")[0]); } catch { continue; }
    if (tableEl.value.trim()) u.searchParams.set("table", tableEl.value.trim());
    const url = tab ? u.href + "#" + encodeURIComponent(tab) : u.href;
    new QRCode(el, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }
}
const tableEl = document.getElementById("tableNo");
base.addEventListener("input", render);
tableEl.addEventListener("input", render);
document.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
  const canvas = document.querySelector("#qr-" + b.dataset.id + " canvas");
  if (!canvas) return;
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "menu-qr-" + b.dataset.id + ".png";
  a.click();
});
render();

// ---- One QR per table ----
function makeTables() {
  const n = Math.min(200, Math.max(0, parseInt(document.getElementById("tableCount").value, 10) || 0));
  const box = document.getElementById("tables");
  box.innerHTML = "";
  let u;
  try { u = new URL(base.value.split("#")[0]); } catch { return; }
  for (let i = 1; i <= n; i++) {
    u.searchParams.set("table", i);
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h3");
    h.textContent = "Table " + i;
    const qr = document.createElement("div");
    qr.className = "qr";
    new QRCode(qr, { text: u.href, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
    const dl = document.createElement("button");
    dl.textContent = "Download PNG";
    dl.onclick = () => {
      const a = document.createElement("a");
      a.href = qr.querySelector("canvas").toDataURL("image/png");
      a.download = "menu-qr-table-" + i + ".png";
      a.click();
    };
    card.append(h, qr, document.createElement("br"), dl);
    box.appendChild(card);
  }
  document.getElementById("printTables").hidden = n === 0;
}
document.getElementById("makeTables").onclick = makeTables;
document.getElementById("printTables").onclick = () => window.print();
</script>
</body>
</html>
