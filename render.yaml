# Render Blueprint: deploys the menu API from the server/ folder.
# The database is a separate free PostgreSQL (Neon); its address goes in DATABASE_URL.
# See server/DEPLOY.md for the step-by-step guide.
services:
  - type: web
    name: menu-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start:prod
    # /api/ping does not touch the database, so Render's constant health checks never keep the database awake.
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string in the Render dashboard
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false          # used once to create the first admin; delete it afterwards
      # Sites allowed to call the API from a browser. The localhost entry is only for testing before the cutover; remove it afterwards.
      - key: ALLOWED_ORIGINS
        value: https://adhamatare.github.io,http://localhost:8765
