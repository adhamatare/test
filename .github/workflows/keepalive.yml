# Optional: pings the API every 10 minutes so the free Render host does not go to sleep (a sleeping host
# makes the first customer wait about 30 seconds). It does nothing until you set a repository VARIABLE named API_URL
# (Settings > Secrets and variables > Actions > Variables) to your server address, e.g. https://your-service.onrender.com
#
# It calls /api/ping, which does not touch the database, so the database can still sleep and stay inside its free allowance.
# GitHub switches scheduled workflows off after 60 days without repository activity; re-enable it in the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL is not set, nothing to do."; exit 0; fi
          curl --fail --silent --show-error --max-time 90 "${API_URL%/}/api/ping" || echo "The API did not answer this time."
