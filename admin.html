<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Menu Admin</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; background: #faf7f2; color: #2b2118; padding-bottom: 90px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 4px; }
  h2 { border-bottom: 2px solid #6b3f1d; padding-bottom: 4px; margin-top: 32px; }
  .note { color: #7a6a58; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: #7a6a58; }
  input[type=text], input[type=number], input[type=password] { width: 100%; box-sizing: border-box; padding: 9px; font-size: 15px; border: 1px solid #c9bba8; border-radius: 8px; margin-top: 3px; }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: #6b3f1d; color: #fff; font-size: 15px; cursor: pointer; }
  button.ghost { background: #e8dfd3; color: #2b2118; }
  button.danger { background: #c0392b; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .sec { background: #f1e8da; border-radius: 12px; padding: 10px; margin: 14px 0; }
  .sec-head { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; background: #efe5d6; display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; flex: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .special { font-weight: 700; color: #c0392b; align-self: end; padding-bottom: 10px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 15px; color: #2b2118; margin-top: 8px; }
  .hours-row { display: grid; grid-template-columns: 90px auto 1fr 1fr; gap: 8px; align-items: end; margin-top: 10px; }
  .area-row { display: grid; grid-template-columns: 1fr 1fr 90px auto; gap: 8px; align-items: end; margin: 10px 0; }
  input[type=time] { width: 100%; box-sizing: border-box; padding: 9px; font-size: 15px; border: 1px solid #c9bba8; border-radius: 8px; margin-top: 3px; }
  @media (max-width: 560px) { .hours-row { grid-template-columns: 1fr 1fr; } .area-row { grid-template-columns: 1fr 1fr; } }
  #bar { position: fixed; inset-inline: 0; bottom: 0; background: #2b2118; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  #bar .msg { flex: 1; font-size: 14px; }
  #bar button { background: #1fa855; font-weight: 600; }
  #bar button.ghost { background: #55483b; font-weight: 400; }
  .err { color: #c0392b; }
  .ok { color: #7be3a1; }
</style>
</head>
<body>
<main>
  <h1>Menu Admin</h1>
  <p class="note">Edit prices, discounts and items. <a href="menu.html" target="_blank">Open the menu</a></p>
  <div id="login" class="card" hidden>
    <form id="loginView" hidden>
      <h3 style="margin-top:0">Sign in</h3>
      <label>Username<input type="text" id="lUser" autocomplete="username"></label>
      <label>Password<input type="password" id="lPass" autocomplete="current-password"></label>
      <div class="row"><button type="submit" id="loginBtn">Sign in</button><button type="button" class="ghost" id="resetBtn">Forgot password / start over</button></div>
      <p id="loginMsg" class="err"></p>
    </form>
    <form id="setupView" hidden>
      <h3 style="margin-top:0">Set up the admin login</h3>
      <p class="note">Pick a username and a password. Your GitHub token is stored on this device only, locked with that password, and you enter it once. The token needs <b>Contents: Read and write</b> on <code>adhamatare/test</code>.</p>
      <label>Username<input type="text" id="sUser" value="adham" autocomplete="username"></label>
      <label>Password (at least 8 characters)<input type="password" id="sPass" autocomplete="new-password"></label>
      <label>Repeat password<input type="password" id="sPass2" autocomplete="new-password"></label>
      <label>GitHub access token<input type="password" id="sToken" autocomplete="off"></label>
      <div class="row"><button type="submit" id="setupBtn">Save and sign in</button></div>
      <p id="setupMsg" class="err"></p>
    </form>
  </div>
  <div id="app" hidden></div>
</main>
<div id="bar" hidden><span class="msg" id="msg"></span><button id="logout" class="ghost">Log out</button><button id="save">Save changes</button></div>

<script>
const REPO = "adhamatare/test", BRANCH = "main", PATH = "menu.json";
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let token = "", sha = "", data = null, dirty = false;   // the token only ever lives in memory; on disk it is locked with the password

// Settings added after the first release; missing ones are filled in when the menu loads.
const dayDefaults = () => Object.fromEntries(["mon", "tue", "wed", "thu", "fri", "sat", "sun"].map(d => [d, { closed: false, open: "09:00", close: "23:00" }]));
const DEFAULT_SETTINGS = { currency: "$", deliveryFee: 0, whatsapp: "", timezone: "Asia/Jerusalem", useHours: false, pauseOrders: false, minDeliveryOrder: 0, freeDeliveryOver: 0, deliveryAreas: [] };

const gh = (url, opts = {}) => fetch("https://api.github.com" + url, {
  ...opts,
  headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opts.headers || {}) }
});

const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const encode = text => { let s = ""; for (const b of new TextEncoder().encode(text)) s += String.fromCharCode(b); return btoa(s); };

function say(text, cls = "") { const m = $("msg"); m.textContent = text; m.className = "msg " + cls; }
const finalPrice = it => Math.round(it.price * (100 - (it.discount || 0))) / 100;

// Checks the token against GitHub and loads the menu. Throws a readable error when it can't.
async function connect() {
  const repo = await gh(`/repos/${REPO}`);
  if (repo.status === 401) throw new Error("GitHub did not accept that token. It may have expired.");
  if (!repo.ok) throw new Error("Cannot open the repository with this token.");
  if (!(await repo.json()).permissions?.push) throw new Error("This token can only read. It needs Contents: Read and write.");
  const res = await gh(`/repos/${REPO}/contents/${PATH}?ref=${BRANCH}`);
  if (!res.ok) throw new Error("Could not load menu.json (" + res.status + ").");
  const file = await res.json();
  sha = file.sha;
  data = JSON.parse(decode(file.content));
  const s = data.settings || {};
  data.settings = { ...DEFAULT_SETTINGS, ...s, hours: { ...dayDefaults(), ...(s.hours || {}) } };
  $("login").hidden = true; $("app").hidden = false; $("bar").hidden = false;
  dirty = false; say("Loaded the current menu.");
  build();
}

// ---- Login: username + password unlock the saved GitHub token (AES-GCM, key from PBKDF2) ----
const b64 = bytes => btoa(String.fromCharCode(...bytes));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

async function lockToken(user, password, tok) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const key = await deriveKey(password, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(tok)));
  return { user, salt: b64(salt), iv: b64(iv), ct: b64(ct), iter };
}

async function unlockToken(vault, password) {
  const key = await deriveKey(password, unb64(vault.salt), vault.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(vault.iv) }, key, unb64(vault.ct)));
}

let failures = 0, lockedUntil = 0;

function showAuth() {
  const vault = JSON.parse(store.get("adminVault") || "null");
  $("login").hidden = false;
  $("loginView").hidden = !vault;
  $("setupView").hidden = !!vault;
  if (vault) $("lUser").value = vault.user;
  else if (store.get("ghToken")) $("sToken").value = store.get("ghToken");   // token saved by the earlier version: lock it with a password
}

$("loginView").onsubmit = async e => {
  e.preventDefault();
  const msg = $("loginMsg");
  if (Date.now() < lockedUntil) { msg.textContent = "Too many attempts. Wait a few seconds and try again."; return; }
  const vault = JSON.parse(store.get("adminVault") || "null");
  $("loginBtn").disabled = true; msg.textContent = "";
  try {
    if ($("lUser").value.trim().toLowerCase() !== vault.user.toLowerCase()) throw new Error("bad");
    token = await unlockToken(vault, $("lPass").value);
  } catch {
    failures++;
    if (failures >= 5) { lockedUntil = Date.now() + 30000; failures = 0; }
    msg.textContent = "Wrong username or password.";
    $("loginBtn").disabled = false;
    return;
  }
  failures = 0; $("lPass").value = "";
  try { await connect(); } catch (err) { token = ""; msg.textContent = err.message + " Use \"Forgot password / start over\" to enter a new token."; }
  $("loginBtn").disabled = false;
};

$("setupView").onsubmit = async e => {
  e.preventDefault();
  const msg = $("setupMsg"), user = $("sUser").value.trim(), pass = $("sPass").value, tok = $("sToken").value.trim();
  msg.textContent = "";
  if (!user) { msg.textContent = "Enter a username."; return; }
  if (pass.length < 8) { msg.textContent = "The password needs at least 8 characters."; return; }
  if (pass !== $("sPass2").value) { msg.textContent = "The two passwords don't match."; return; }
  if (!tok) { msg.textContent = "Paste your GitHub access token."; return; }
  $("setupBtn").disabled = true; msg.textContent = "Checking the token...";
  token = tok;
  try {
    await connect();
    store.set("adminVault", JSON.stringify(await lockToken(user, pass, tok)));
    store.del("ghToken");
    $("sPass").value = $("sPass2").value = $("sToken").value = "";
  } catch (err) { token = ""; msg.textContent = err.message; }
  $("setupBtn").disabled = false;
};

$("resetBtn").onclick = () => {
  if (!confirm("This removes the saved login and token from this device. You will need your GitHub token again. Continue?")) return;
  store.del("adminVault"); store.del("ghToken"); location.reload();
};

// ---- Editor ----
function field(label, obj, key, { type = "text", wide = false, ...attrs } = {}) {
  const wrap = document.createElement("label");
  if (wide) wrap.className = "wide";
  wrap.append(label);
  const el = document.createElement("input");
  el.type = type; el.value = obj[key] ?? "";
  Object.assign(el, attrs);
  el.oninput = () => {
    obj[key] = type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
    dirty = true; say("Unsaved changes");
    el.dispatchEvent(new CustomEvent("edited", { bubbles: true }));
  };
  wrap.append(el);
  return wrap;
}

function checkbox(label, obj, key) {
  const chk = document.createElement("label");
  chk.className = "check";
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = !!obj[key];
  box.onchange = () => { obj[key] = box.checked; dirty = true; say("Unsaved changes"); };
  chk.append(box, label);
  return chk;
}

function btn(text, cls, fn) {
  const b = document.createElement("button");
  b.textContent = text; if (cls) b.className = cls; b.onclick = fn;
  return b;
}

function nextId() { return "n" + Date.now().toString(36) + Math.floor(Math.random() * 1000); }

function itemCard(sec, it) {
  const card = document.createElement("div");
  card.className = "card";
  const grid = document.createElement("div");
  grid.className = "grid";
  const special = document.createElement("div");
  const refresh = () => {
    special.className = "special";
    special.textContent = it.discount > 0 ? `Special price: ${data.settings.currency}${finalPrice(it).toFixed(2)}` : "No discount";
  };
  refresh();
  const picField = field("Picture (emoji, or an image path like images/burger.jpg)", it, "pic", { wide: true });
  const picInput = picField.querySelector("input");
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const showThumb = () => {
    thumb.innerHTML = "";
    const p = it.pic || "";
    if (/[\/.]/.test(p)) { const img = document.createElement("img"); img.src = previews[p] || p; img.alt = ""; thumb.append(img); }
    else thumb.textContent = p;
  };
  showThumb();
  const up = document.createElement("input");
  up.type = "file"; up.accept = "image/*"; up.hidden = true;
  const upBtn = btn("Upload photo", "ghost", () => up.click());
  up.onchange = async () => {
    const file = up.files[0];
    up.value = "";
    if (!file) return;
    upBtn.disabled = true; say("Uploading photo...");
    try {
      const { path, url } = await uploadPhoto(file, it);
      previews[path] = url;
      it.pic = path; picInput.value = path;
      dirty = true; showThumb();
      say("Photo uploaded. Click Save changes to put it on the menu.", "ok");
    } catch (e) { say(e.message, "err"); }
    upBtn.disabled = false;
  };
  picInput.addEventListener("input", showThumb);
  const photoRow = document.createElement("div");
  photoRow.className = "row wide";
  photoRow.append(thumb, upBtn, up);
  grid.append(
    field("Title (English)", it, "en"),
    field("Title (Arabic)", it, "ar", { dir: "rtl" }),
    field("Description (English)", it, "dEn"),
    field("Description (Arabic)", it, "dAr", { dir: "rtl" }),
    field("Price", it, "price", { type: "number", min: 0, step: "0.01" }),
    field("Discount % (0 = none)", it, "discount", { type: "number", min: 0, max: 100, step: "1" }),
    picField,
    photoRow,
    special
  );
  card.addEventListener("edited", refresh);
  const row = document.createElement("div");
  row.className = "row";
  row.append(checkbox("Mark as NEW", it, "isNew"), checkbox("Sold out (shown greyed, can't be ordered)", it, "soldOut"), checkbox("Hide from menu", it, "hidden"), btn("Delete item", "danger", () => {
    if (!confirm(`Delete "${it.en || "this item"}"?`)) return;
    sec.items.splice(sec.items.indexOf(it), 1);
    dirty = true; say("Unsaved changes"); build();
  }));
  card.append(grid, row);
  return card;
}

function build() {
  const app = $("app");
  app.innerHTML = "";

  // Shows which items are sold out or hidden right now, so a ticked box can't be missed.
  const summary = document.createElement("div");
  summary.className = "card";
  const updateSummary = () => {
    const all = data.venues.flatMap(v => v.sections.flatMap(sec => sec.items));
    const names = key => all.filter(i => i[key]).map(i => i.en || "(untitled)").join(", ") || "none";
    summary.innerHTML = "";
    for (const [label, key] of [["Sold out now", "soldOut"], ["Hidden now", "hidden"]]) {
      const p = document.createElement("div");
      const b = document.createElement("b"); b.textContent = label + ": ";
      p.append(b, names(key));
      summary.append(p);
    }
  };
  updateSummary();
  refreshSummary = updateSummary;
  app.append(summary);

  const s = data.settings;
  const sc = document.createElement("div");
  sc.className = "card";
  sc.innerHTML = "<h3 style='margin-top:0'>Settings</h3>";
  const sg = document.createElement("div");
  sg.className = "grid";
  sg.append(
    field("Currency symbol", s, "currency"),
    field("Delivery fee", s, "deliveryFee", { type: "number", min: 0, step: "0.01" }),
    field("Orders WhatsApp number (digits, with country code)", s, "whatsapp", { wide: true, inputMode: "numeric" })
  );
  sc.append(sg);
  app.append(sc);

  // Opening hours and pausing orders
  const hc = document.createElement("div");
  hc.className = "card";
  hc.innerHTML = "<h3 style='margin-top:0'>Opening hours</h3>";
  const hnote = document.createElement("p");
  hnote.className = "note";
  hnote.textContent = "When hours are on, customers can only order while you are open. Set a close time earlier than the open time for a shop that closes after midnight.";
  hc.append(hnote, checkbox("Use opening hours (block orders when closed)", s, "useHours"), checkbox("Pause all orders right now", s, "pauseOrders"));
  const tz = document.createElement("div");
  tz.className = "grid";
  tz.append(field("Time zone (e.g. Asia/Jerusalem, Africa/Cairo, Asia/Riyadh)", s, "timezone", { wide: true }));
  hc.append(tz);
  const dayNames = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
  for (const [key, label] of Object.entries(dayNames)) {
    const r = document.createElement("div");
    r.className = "hours-row";
    const name = document.createElement("b"); name.textContent = label;
    r.append(name, checkbox("Closed", s.hours[key], "closed"),
      field("Opens", s.hours[key], "open", { type: "time" }), field("Closes", s.hours[key], "close", { type: "time" }));
    hc.append(r);
  }
  app.append(hc);

  // Delivery rules
  const dc = document.createElement("div");
  dc.className = "card";
  dc.innerHTML = "<h3 style='margin-top:0'>Delivery</h3>";
  const dnote = document.createElement("p");
  dnote.className = "note";
  dnote.textContent = "If you add delivery areas, each has its own fee and the customer must pick one. With no areas, the flat delivery fee above is used.";
  const dg = document.createElement("div");
  dg.className = "grid";
  dg.append(
    field("Minimum order for delivery (0 = none)", s, "minDeliveryOrder", { type: "number", min: 0, step: "0.01" }),
    field("Free delivery from this order total (0 = never)", s, "freeDeliveryOver", { type: "number", min: 0, step: "0.01" })
  );
  dc.append(dnote, dg);
  for (const area of s.deliveryAreas) {
    const r = document.createElement("div");
    r.className = "area-row";
    r.append(field("Area (English)", area, "en"), field("Area (Arabic)", area, "ar", { dir: "rtl" }),
      field("Fee", area, "fee", { type: "number", min: 0, step: "0.01" }),
      btn("Remove", "danger", () => { s.deliveryAreas.splice(s.deliveryAreas.indexOf(area), 1); dirty = true; say("Unsaved changes"); build(); }));
    dc.append(r);
  }
  dc.append(btn("+ Add delivery area", "ghost", () => { s.deliveryAreas.push({ en: "", ar: "", fee: 0 }); dirty = true; say("Unsaved changes"); build(); }));
  app.append(dc);

  for (const venue of data.venues) {
    const h = document.createElement("h2");
    h.textContent = venue.key;
    app.append(h);
    for (const sec of venue.sections) {
      const box = document.createElement("div");
      box.className = "sec";
      const head = document.createElement("div");
      head.className = "sec-head";
      head.append(
        field("Category (English)", sec, "en"),
        field("Category (Arabic)", sec, "ar", { dir: "rtl" }),
        btn("Delete category", "danger", () => {
          if (!confirm(`Delete the category "${sec.en}" and all its items?`)) return;
          venue.sections.splice(venue.sections.indexOf(sec), 1);
          dirty = true; say("Unsaved changes"); build();
        })
      );
      box.append(head);
      for (const it of sec.items) box.append(itemCard(sec, it));
      box.append(btn("+ Add new item", "", () => {
        sec.items.push({ id: nextId(), en: "", ar: "", dEn: "", dAr: "", price: 0, discount: 0, pic: "🍽️", isNew: true });
        dirty = true; say("Unsaved changes"); build();
      }));
      app.append(box);
    }
    app.append(btn("+ Add category", "ghost", () => {
      venue.sections.push({ en: "New category", ar: "", items: [] });
      dirty = true; say("Unsaved changes"); build();
    }));
  }
}

// ---- Photos ----
const previews = {};   // uploaded path -> local blob URL, so the preview shows before the site redeploys

// Shrinks the photo (max 800px, JPEG) so phone pictures stay small and load fast on the menu.
async function toJpeg(file, max = 800, quality = 0.82) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error("This image format is not supported. Use a JPG or PNG photo."); }
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
}

const toBase64 = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(String(r.result).split(",")[1]);
  r.onerror = () => reject(new Error("Could not read the photo."));
  r.readAsDataURL(blob);
});

async function uploadPhoto(file, it) {
  if (!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  if (file.size > 25 * 1024 * 1024) throw new Error("That photo is too large (25 MB max).");
  const blob = await toJpeg(file);
  const path = `images/${it.id}-${Date.now().toString(36)}.jpg`;
  const res = await gh(`/repos/${REPO}/contents/${path}`, {
    method: "PUT",
    body: JSON.stringify({ message: `Add photo for ${it.en || it.id}`, content: await toBase64(blob), branch: BRANCH })
  });
  if (!res.ok) throw new Error("Photo upload failed (" + res.status + ").");
  return { path, url: URL.createObjectURL(blob) };
}

// ---- Save ----
function validate() {
  const s = data.settings;
  if (!(s.deliveryFee >= 0) || !(s.minDeliveryOrder >= 0) || !(s.freeDeliveryOver >= 0)) return "Delivery fee, minimum order and free-delivery amount can't be negative.";
  if (!/^\d{8,15}$/.test(String(s.whatsapp).replace(/\D/g, ""))) return "The orders WhatsApp number must be 8 to 15 digits with the country code.";
  if (s.useHours) {
    try { new Intl.DateTimeFormat("en-US", { timeZone: s.timezone }); } catch { return `"${s.timezone}" is not a valid time zone.`; }
    for (const [d, r] of Object.entries(s.hours)) if (!r.closed && (!r.open || !r.close)) return `Set open and close times for ${d}, or mark it closed.`;
  }
  for (const a of s.deliveryAreas) {
    if (!a.en.trim()) return "Every delivery area needs an English name.";
    if (!(a.fee >= 0)) return `Delivery area "${a.en}" has an invalid fee.`;
  }
  for (const v of data.venues) for (const sec of v.sections) for (const it of sec.items) {
    if (!it.en.trim()) return `An item in "${sec.en}" has no English title.`;
    if (!(it.price >= 0)) return `"${it.en}" has an invalid price.`;
    if (!(it.discount >= 0 && it.discount <= 100)) return `"${it.en}" needs a discount between 0 and 100.`;
  }
  return "";
}

async function save() {
  const problem = validate();
  if (problem) { say(problem, "err"); return; }
  $("save").disabled = true; say("Saving...");
  try {
    const res = await gh(`/repos/${REPO}/contents/${PATH}`, {
      method: "PUT",
      body: JSON.stringify({
        message: "Update menu from admin page",
        content: encode(JSON.stringify(data, null, 2) + "\n"),
        sha, branch: BRANCH
      })
    });
    if (res.status === 409 || res.status === 422) throw new Error("The menu was changed somewhere else. Reload this page and try again.");
    if (!res.ok) throw new Error("Save failed (" + res.status + ").");
    sha = (await res.json()).content.sha;
    dirty = false;
    say("Saved. The live menu updates in about a minute.", "ok");
  } catch (e) {
    say(e.message, "err");
  }
  $("save").disabled = false;
}

let refreshSummary = null;
$("app").addEventListener("change", () => { if (refreshSummary) refreshSummary(); });
$("save").onclick = save;
$("logout").onclick = () => { if (dirty && !confirm("Discard unsaved changes?")) return; dirty = false; location.reload(); };
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

showAuth();
</script>
</body>
</html>
