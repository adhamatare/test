<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f1d13">
<title>Menu</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f2ec; --surface: #ffffff; --surface-2: #f0e8de; --line: #e6dccf;
    --ink: #221a14; --muted: #6d6157; --faint: #9a8d81;
    --hero: #2f1d13; --hero-ink: #fbf3ea; --hero-muted: #d9c6b4;
    --brand: #8a4b26; --on-brand: #ffffff; --brand-soft: #f5e6da;
    --deal-bg: #fde4d6; --deal-ink: #9a3412;
    --new-bg: #e1f2e5; --new-ink: #1d6b34;
    --ok: #177a43; --on-ok: #ffffff;
    --bad-bg: #fdecea; --bad-ink: #a8231a;
    --shadow: 0 10px 30px rgba(47, 29, 19, .18);
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14100d; --surface: #1e1814; --surface-2: #2a221c; --line: #382e26;
      --ink: #f4ece3; --muted: #b9ab9d; --faint: #8c7f73;
      --hero: #241812; --hero-ink: #f8ede1; --hero-muted: #c9b29d;
      --brand: #e2a272; --on-brand: #1c120c; --brand-soft: #3a2a1f;
      --deal-bg: #4a2416; --deal-ink: #ffb894;
      --new-bg: #173823; --new-ink: #93dcaa;
      --bad-bg: #3d1714; --bad-ink: #ff9d92;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding-bottom: 104px; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* header */
  .hero { background: var(--hero); color: var(--hero-ink); padding: 24px 16px 24px; }
  .hero-in { max-width: 960px; margin: 0 auto; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { flex: none; }
  .lang { min-height: 40px; padding: 0 16px; border: 1px solid color-mix(in srgb, var(--hero-ink) 35%, transparent); border-radius: 999px; background: transparent; color: var(--hero-ink); cursor: pointer; }
  .lang:hover { background: color-mix(in srgb, var(--hero-ink) 12%, transparent); }
  .hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(32px, 7vw, 44px); line-height: 1.05; letter-spacing: -.01em; margin: 0 0 14px; }
  :lang(ar) .hero h1, :lang(ar) h2 { font-family: var(--body); letter-spacing: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 14px; background: color-mix(in srgb, var(--hero-ink) 12%, transparent); color: var(--hero-ink); }
  .pill:empty { display: none; }
  .pill.ok::before, .pill.bad::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  .pill.bad::before { background: #f87171; }

  /* notices */
  .notices { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  #banner { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--bad-bg); color: var(--bad-ink); font-weight: 600; }
  #banner small { display: block; font-weight: 400; margin-top: 2px; }
  #track { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  #track .tt { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  #track .x, .sheet-head .x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
  #track ol { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 14px 0 0; padding: 0; }
  #track li { position: relative; padding-top: 16px; font-size: 12px; text-align: center; color: var(--faint); }
  #track li::before { content: ""; position: absolute; top: 0; inset-inline: 0; height: 6px; border-radius: 3px; background: var(--surface-2); }
  #track li.done { color: var(--ok); }
  #track li.done::before { background: var(--ok); opacity: .45; }
  #track li.now { color: var(--ok); font-weight: 700; }
  #track li.now::before { background: var(--ok); }
  #track.cancelled { background: var(--bad-bg); border-color: transparent; color: var(--bad-ink); }

  /* sticky menu tabs and section shortcuts */
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .tabs, .chips { display: flex; gap: 8px; max-width: 960px; margin: 0 auto; padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .chips { padding: 10px 16px 12px; }
  .tabs:last-child { padding-bottom: 12px; }
  .tabs button { flex: none; min-height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chips button { flex: none; min-height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 14px; cursor: pointer; }
  .chips button:hover { color: var(--ink); }

  /* menu */
  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 0; }
  .sec h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 28px 0 12px; scroll-margin-top: 130px; }
  .grid { display: grid; gap: 12px; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 340px) { .card { grid-template-columns: 72px 1fr !important; } .pic { width: 72px !important; height: 72px !important; font-size: 34px !important; } .foot { flex-wrap: wrap; } }
  .card { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .card.combo { background: var(--brand-soft); border-color: transparent; }
  .pic { position: relative; width: 96px; height: 96px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 44px; overflow: hidden; }
  .card.combo .pic { background: var(--surface); }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .soldout .pic > :not(.ovl) { filter: grayscale(1); opacity: .45; }
  .soldout .name, .soldout .desc, .soldout .now { color: var(--faint); }
  .ovl { position: absolute; inset-inline: 0; bottom: 0; padding: 4px 2px; background: rgba(20, 14, 10, .82); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .body { display: flex; flex-direction: column; min-width: 0; }
  .name { margin: 2px 0 0; font-size: 17px; font-weight: 650; line-height: 1.3; }
  .badge { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; vertical-align: 2px; white-space: nowrap; }
  .badge.new { background: var(--new-bg); color: var(--new-ink); }
  .badge.off { background: var(--deal-bg); color: var(--deal-ink); }
  .desc, .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--ink); }
  .foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .now { font-size: 17px; font-weight: 700; }
  .was { font-size: 14px; color: var(--faint); }
  .add { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--brand); border-radius: 999px; background: transparent; color: var(--brand); font-weight: 650; cursor: pointer; white-space: nowrap; }
  .add:hover:not(:disabled) { background: var(--brand); color: var(--on-brand); }
  .add:disabled { border-color: var(--line); color: var(--faint); cursor: not-allowed; }
  .add span { font-size: 20px; line-height: 1; }
  .qty { display: inline-flex; align-items: center; border-radius: 999px; background: var(--brand); color: var(--on-brand); }
  .qty button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 20px; cursor: pointer; }
  .qty .n { min-width: 22px; text-align: center; font-weight: 700; }
  .loading { display: grid; gap: 12px; margin-top: 24px; }
  .loading div { height: 120px; border-radius: var(--r); background: var(--surface-2); }
  .failed { margin: 40px 0; text-align: center; color: var(--muted); }

  /* floating cart */
  .cartbar { position: fixed; z-index: 6; inset-inline: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; min-height: 60px; padding: 8px 18px 8px 8px; border: 0; border-radius: 20px; background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 650; text-align: start; }
  [dir="rtl"] .cartbar { padding: 8px 8px 8px 18px; }
  .cartbar .count { min-width: 44px; height: 44px; padding: 0 8px; border-radius: 14px; background: color-mix(in srgb, var(--on-brand) 18%, transparent); display: grid; place-items: center; font-weight: 800; }
  .cartbar #barCount { flex: 1; }
  .cartbar #barTotal { font-size: 18px; }

  /* order sheet */
  #sheet { position: fixed; inset: 0; z-index: 10; background: rgba(15, 10, 6, .55); display: none; align-items: flex-end; justify-content: center; }
  #sheet .panel { position: relative; background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); outline: none; }
  #sheet .panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line); }
  @media (min-width: 760px) { #sheet { align-items: center; } #sheet .panel { border-radius: 24px; max-height: 86vh; } #sheet .panel::before { display: none; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .panel h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0; }
  .line { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .linetop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 10px; }
  .linetop > span:first-child { flex: 1 1 120px; min-width: 0; font-weight: 600; }   /* on very narrow screens the stepper and price drop below the name */
  .linetop > span:last-child { white-space: nowrap; }
  .line .qty { background: var(--surface-2); color: var(--ink); }
  .line .qty button { width: 36px; height: 36px; font-size: 18px; }
  .panel .line input { margin: 6px 0 0; padding: 8px 0; font-size: 14px; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: transparent; }
  .panel .line input:focus { outline: none; border-bottom: 1px solid var(--brand); }
  .parts { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .label { margin: 18px 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  :lang(ar) .label { text-transform: none; letter-spacing: 0; }
  .panel input, .panel textarea, .panel select { width: 100%; padding: 12px 14px; margin: 0 0 10px; font: inherit; font-size: 16px; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .panel textarea { resize: vertical; }
  .panel input:focus, .panel textarea:focus, .panel select:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 14px; background: var(--surface-2); }
  .types button { min-height: 42px; padding: 0 4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
  .types button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .panel .bad { border-color: var(--bad-ink); background: var(--bad-bg); }
  .summary { margin: 8px 0 4px; padding: 6px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .summary .linetop { padding: 8px 0; }
  .summary .linetop > span:first-child { font-weight: 400; color: var(--muted); }
  .saving > span { color: var(--ok) !important; font-weight: 650 !important; }
  .total { display: flex; justify-content: space-between; padding: 10px 0 8px; margin-top: 2px; border-top: 1px solid var(--line); font-size: 19px; font-weight: 750; }
  .summary .total:first-child { border-top: 0; }
  .warn { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--bad-bg); color: var(--bad-ink); font-size: 14px; }
  .send, .secondary { width: 100%; min-height: 54px; padding: 0 16px; border: 0; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .send { background: var(--ok); color: var(--on-ok); }
  .send:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
  .secondary { background: var(--surface-2); color: var(--ink); margin-top: 10px; }
  .close { width: 100%; min-height: 48px; margin-top: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .ordno { margin: 14px auto; padding: 16px; max-width: 320px; border: 2px dashed var(--line); border-radius: 18px; background: var(--surface); font-size: 30px; font-weight: 800; letter-spacing: 2px; text-align: center; }
  .center { text-align: center; }
  p.center { color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    #sheet { animation: fade .18s ease-out; }
    #sheet .panel { animation: rise .24s cubic-bezier(.2, .8, .2, 1); }
    .cartbar.bump { animation: bump .3s ease-out; }
    .loading div { animation: pulse 1.2s ease-in-out infinite alternate; }
    .card, .add, .tabs button { transition: background-color .15s, border-color .15s, color .15s; }
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(32px); opacity: .6; } }
  @keyframes bump { 40% { transform: scale(1.03); } }
  @keyframes pulse { to { opacity: .5; } }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="hero-top"><h1 id="title"></h1><button id="lang" class="lang" type="button"></button></div>
    <div class="meta"><span id="status" class="pill"></span><span id="table" class="pill"></span></div>
  </div>
</header>
<div class="notices">
  <div id="banner" role="status"></div>
  <div id="track" aria-live="polite"></div>
</div>
<div class="sticky">
  <nav id="tabs" class="tabs"></nav>
  <nav id="chips" class="chips" hidden></nav>
</div>
<main id="menu"><div class="loading" aria-hidden="true"><div></div><div></div><div></div></div></main>
<button id="bar" class="cartbar" type="button" hidden><span class="count" id="barQty"></span><span id="barCount"></span><span id="barTotal"></span></button>
<div id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<script>
// ---- Settings ----
// Overwritten from menu.json "settings" (editable in admin.html).
let SETTINGS = {};
let WHATSAPP_NUMBER = "";   // Counter/kitchen WhatsApp, digits only with country code. Empty = customer picks the contact.
let CURRENCY = { en: "$", ar: "$" };
const OFFERS = "__offers";  // Virtual tab listing every discounted item.
const DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

const UI = {
  en: { title: "Our Menu", table: "Table", add: "Add", offers: "Special offers", combos: "Combo offers", save: "Save", youSave: "You save", unavailable: "Unavailable", includes: "Includes", new: "NEW", soldOut: "Sold out", cart: "View order", order: "Your order", tableNo: "Table number", name: "Your name", customer: "Customer", type: "Order type", dinein: "Dine in", takeaway: "Takeaway", delivery: "Delivery", fee: "Delivery fee", free: "Free", phone: "Phone number", address: "Delivery address", area: "Delivery area", pickArea: "Select your area", note: "Notes (optional)", itemNote: "Changes for this item (e.g. no onions)", total: "Total", send: "Send order via WhatsApp", close: "Keep browsing", empty: "Your order is empty", greeting: "New order", orderNo: "Order", lang: "العربية",
        closed: "We're closed right now", paused: "Online ordering is paused right now", todayHours: "Today's hours", closedToday: "Closed today", minOrder: "Minimum order for delivery is", badPhone: "Please enter a valid phone number", needArea: "Please select your delivery area",
        confirmTitle: "Almost done!", confirmText: "WhatsApp opened with your order. Press Send in WhatsApp to place it. Your order is NOT placed until you send the message.", openAgain: "Open WhatsApp again", sent: "I sent it", back: "Back to my order", thanks: "Thank you! We received your order message.", keep: "Keep this order number", done: "Done", trackTitle: "Order status", hide: "Hide",
        openNow: "Open now", closedNow: "Closed", pausedShort: "Ordering paused", remove: "Remove one", subtotal: "Subtotal", loadError: "Could not load the menu. Please refresh.", menus: "Menus", sections: "Sections",
        st: { open: "Open", picked: "Picked", in_progress: "In progress", ready: { takeaway: "Ready for pickup", dinein: "Ready to serve", delivery: "Ready for delivery" }, cancelled: "Cancelled" } },
  ar: { title: "قائمة الطعام", table: "طاولة", add: "أضف", offers: "العروض", combos: "عروض الكومبو", save: "وفّر", youSave: "وفّرت", unavailable: "غير متوفر", includes: "يشمل", new: "جديد", soldOut: "نفدت الكمية", cart: "عرض الطلب", order: "طلبك", tableNo: "رقم الطاولة", name: "اسمك", customer: "العميل", type: "نوع الطلب", dinein: "في المطعم", takeaway: "سفري", delivery: "توصيل", fee: "رسوم التوصيل", free: "مجاني", phone: "رقم الهاتف", address: "عنوان التوصيل", area: "منطقة التوصيل", pickArea: "اختر منطقتك", note: "ملاحظات (اختياري)", itemNote: "تعديلات على هذا الصنف (مثال: بدون بصل)", total: "الإجمالي", send: "إرسال الطلب عبر واتساب", close: "متابعة التصفح", empty: "طلبك فارغ", greeting: "طلب جديد", orderNo: "الطلب", lang: "English",
        closed: "نحن مغلقون الآن", paused: "الطلب عبر الإنترنت متوقف مؤقتًا", todayHours: "ساعات اليوم", closedToday: "مغلق اليوم", minOrder: "الحد الأدنى لطلب التوصيل", badPhone: "يرجى إدخال رقم هاتف صحيح", needArea: "يرجى اختيار منطقة التوصيل",
        confirmTitle: "أوشكنا على الانتهاء!", confirmText: "فتح واتساب مع طلبك. اضغط إرسال في واتساب لتأكيد الطلب. لن يتم تسجيل طلبك حتى ترسل الرسالة.", openAgain: "افتح واتساب مرة أخرى", sent: "أرسلتها", back: "العودة إلى طلبي", thanks: "شكرًا لك! وصلتنا رسالة طلبك.", keep: "احتفظ برقم الطلب", done: "تم", trackTitle: "حالة الطلب", hide: "إخفاء",
        openNow: "مفتوح الآن", closedNow: "مغلق", pausedShort: "الطلب متوقف", remove: "أزل واحدًا", subtotal: "المجموع الفرعي", loadError: "تعذّر تحميل القائمة. يرجى تحديث الصفحة.", menus: "القوائم", sections: "الأقسام",
        st: { open: "مفتوح", picked: "تم الاستلام", in_progress: "قيد التحضير", ready: { takeaway: "جاهز للاستلام", dinein: "جاهز للتقديم", delivery: "جاهز للتوصيل" }, cancelled: "ملغي" } }
};

// Menu content comes from menu.json (edited through admin.html).
// Item: { id, en, ar, dEn, dAr, price, discount (percent), pic, isNew, soldOut, hidden }. pic is an emoji, or an image path/URL.
let MENUS = {};
let BUNDLES = [];   // Combo offers: { id, en, ar, dEn, dAr, price, pic, isNew, hidden, items: [{ id, qty }] }

// ---- State ----
const params = new URLSearchParams(location.search);
// Optional backend. Empty = menu.json + WhatsApp only (how the live site works).
// For testing, open menu.html?api=http://localhost:3000
const API_URL = (params.get("api") || "").replace(/\/+$/, "");
let sending = false, sendError = "";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let lang = params.get("lang") || store.get("lang") || "en";
if (!UI[lang]) lang = "en";
let tab = "";
let tableNo = params.get("table") || "";
// How the customer wants the order served; a table QR defaults to dine-in.
const order = { type: tableNo ? "dinein" : "takeaway", name: "", table: tableNo, phone: "", address: "", area: "", note: "" };
const cart = {};   // id -> { name, ar, price, qty, note }
let view = "order";   // order | confirm | done
let pending = null;   // { id, url } once the WhatsApp chat has been opened
let wasOpen = true;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const t = k => UI[lang][k];
const money = n => CURRENCY[lang] + n.toFixed(2);
const fmtNum = n => lang === "ar" ? String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(n);

function totals() {
  let count = 0, sum = 0;
  for (const l of Object.values(cart)) { count += l.qty; sum += l.qty * l.price; }
  return { count, sum: Math.round(sum * 100) / 100 };
}

// ---- Opening hours ----
function openStatus() {
  if (SETTINGS.pauseOrders) return { open: false, paused: true };
  if (!SETTINGS.useHours || !SETTINGS.hours) return { open: true };
  let day, mins;
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
      timeZone: SETTINGS.timezone || "UTC", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23"
    }).formatToParts(new Date()).map(x => [x.type, x.value]));
    day = DAYS.indexOf(p.weekday.toLowerCase().slice(0, 3));
    mins = (Number(p.hour) % 24) * 60 + Number(p.minute);
  } catch { return { open: true }; }   // unknown timezone: never block customers
  const toMin = s => { const [h, m] = String(s).split(":").map(Number); return h * 60 + (m || 0); };
  const rangeOf = d => { const r = SETTINGS.hours[DAYS[(d + 7) % 7]]; return r && !r.closed ? [toMin(r.open), toMin(r.close)] : null; };
  const today = rangeOf(day), yesterday = rangeOf(day - 1);
  let open = false;
  if (today) { const [o, c] = today; open = c > o ? mins >= o && mins < c : mins >= o; }   // close <= open means past midnight
  if (!open && yesterday) { const [o, c] = yesterday; if (c <= o) open = mins < c; }
  return { open, today: SETTINGS.hours[DAYS[day]] };
}

function renderBanner() {
  const s = openStatus(), b = $("banner"), pill = $("status");
  wasOpen = s.open;
  // Small "Open now / Closed" pill in the header; nothing when opening hours are not used.
  pill.className = "pill " + (s.open ? "ok" : "bad");
  pill.textContent = s.paused ? t("pausedShort") : !SETTINGS.useHours ? "" : s.open ? t("openNow") : t("closedNow");
  if (s.open) { b.style.display = "none"; return; }
  b.style.display = "block";
  b.textContent = s.paused ? t("paused") : t("closed");
  if (!s.paused && s.today) {
    const small = document.createElement("small");
    small.textContent = s.today.closed ? t("closedToday") : `${t("todayHours")}: ${fmtNum(s.today.open)} - ${fmtNum(s.today.close)}`;
    b.appendChild(small);
  }
}

// ---- Delivery ----
function deliveryFee(sum) {
  if (order.type !== "delivery") return 0;
  if (Number(SETTINGS.freeDeliveryOver) > 0 && sum >= Number(SETTINGS.freeDeliveryOver)) return 0;
  const areas = SETTINGS.deliveryAreas || [];
  if (areas.length) { const a = areas[order.area]; return a ? Number(a.fee) || 0 : 0; }
  return Number(SETTINGS.deliveryFee) || 0;
}
const validPhone = p => { const d = p.replace(/\D/g, ""); return d.length >= 8 && d.length <= 15; };

function picture(src) {
  const pic = document.createElement("div");
  pic.className = "pic";
  if (/[\/.]/.test(src)) {
    const img = document.createElement("img");
    img.src = src; img.alt = ""; img.loading = "lazy";
    pic.appendChild(img);
  } else {
    const em = document.createElement("span");
    em.textContent = src;
    pic.appendChild(em);
  }
  return pic;
}

const finalPrice = it => Math.round(it.price * (100 - (it.discount || 0))) / 100;

function sectionsFor(key) {
  if (key !== OFFERS) return MENUS[key].sections;
  return Object.entries(MENUS)
    .map(([k, m]) => ({ en: k, ar: m.ar, items: m.sections.flatMap(s => s.items).filter(it => it.discount > 0 && !it.hidden) }))
    .filter(s => s.items.length);
}

// ---- Combo offers (several items for one special price) ----
const itemById = {};
const indexItems = () => { for (const m of Object.values(MENUS)) for (const s of m.sections) for (const it of s.items) itemById[it.id] = it; };
const bundleLines = b => b.items.map(r => ({ it: itemById[r.id], qty: r.qty })).filter(x => x.it);
const round2 = n => Math.round(n * 100) / 100;
const bundleRegular = b => round2(bundleLines(b).reduce((s, x) => s + finalPrice(x.it) * x.qty, 0));   // what the items cost one by one
const bundleSaving = b => Math.max(0, round2(bundleRegular(b) - b.price));
const bundleAvailable = b => b.items.length > 0 && b.items.every(r => { const it = itemById[r.id]; return it && !it.hidden && !it.soldOut; });
const bundleParts = (b, l) => bundleLines(b).map(x => `${l === "ar" ? fmtNum(x.qty) : x.qty} x ${l === "ar" && x.it.ar ? x.it.ar : x.it.en}`).join(l === "ar" ? "، " : ", ");
const visibleBundles = () => BUNDLES.filter(b => !b.hidden);

const hasOffers = () => sectionsFor(OFFERS).length > 0 || visibleBundles().length > 0;

// ---- Cart (kept on this device so a refresh or a trip to WhatsApp doesn't lose it) ----
function saveCart() {
  const slim = {};
  for (const [id, l] of Object.entries(cart)) slim[id] = { qty: l.qty, note: l.note || "" };
  store.set("cart_v1", JSON.stringify({ at: Date.now(), items: slim }));
  if (pending) store.set("pending_v1", JSON.stringify({ at: Date.now(), ...pending })); else store.del("pending_v1");
}

function restoreCart() {
  const byId = {};
  for (const m of Object.values(MENUS)) for (const s of m.sections) for (const it of s.items) byId[it.id] = it;
  try {
    const saved = JSON.parse(store.get("cart_v1") || "null");
    if (saved && Date.now() - saved.at < 6 * 3600e3) {
      for (const [id, v] of Object.entries(saved.items)) {
        if (id.startsWith("b:")) {
          const b = BUNDLES.find(x => "b:" + x.id === id);
          if (b && !b.hidden && bundleAvailable(b)) cart[id] = { name: b.en, ar: b.ar || b.en, price: b.price, qty: v.qty, note: v.note };
          continue;
        }
        const it = byId[id];
        if (it && !it.hidden && !it.soldOut) cart[id] = { name: it.en, ar: it.ar, price: finalPrice(it), qty: v.qty, note: v.note };
      }
    }
    const p = JSON.parse(store.get("pending_v1") || "null");
    if (p && Date.now() - p.at < 12 * 3600e3 && Object.keys(cart).length) { pending = { id: p.id, url: p.url }; view = "confirm"; }
    else store.del("pending_v1");
  } catch {}
}

// ---- Order status (only for orders saved on the backend) ----
const STEPS = ["open", "picked", "in_progress", "ready"];
const isFinal = s => s === "ready" || s === "cancelled";
let track = null;   // { id, token, api, type, status, at }
try { track = JSON.parse(store.get("track_v1") || "null"); } catch {}
if (track && track.status === "completed") track.status = "ready";   // saved before "completed" was removed
if (track && Date.now() - track.at > 12 * 3600e3) { track = null; store.del("track_v1"); }

function startTrack(saved) {
  track = { id: saved.id, token: saved.token, api: API_URL, type: order.type, status: "open", at: Date.now() };
  store.set("track_v1", JSON.stringify(track));
  renderTrack();
}

function dropTrack() { track = null; store.del("track_v1"); renderTrack(); }

async function pollTrack() {
  if (!track || isFinal(track.status)) return;
  try {
    const r = await fetch(`${track.api}/api/orders/${track.id}/status?t=${encodeURIComponent(track.token)}`, { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (r.status === 404) return dropTrack();
    if (!r.ok) return;
    const s = await r.json();
    if (s.status !== track.status) { track.status = s.status; track.type = s.type; store.set("track_v1", JSON.stringify(track)); renderTrack(); }
  } catch {}   // offline or server asleep: keep showing the last known status
}

const stepLabel = (key) => { const v = UI[lang].st[key]; return typeof v === "object" ? v[track.type] || v.takeaway : v; };

function renderTrack() {
  const box = $("track");
  if (!track) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.className = track.status === "cancelled" ? "cancelled" : "";
  box.innerHTML = "";
  const top = document.createElement("div"); top.className = "tt";
  const title = document.createElement("span");
  title.textContent = `${t("trackTitle")} - ${t("orderNo")} #${track.id}`;
  top.appendChild(title);
  if (isFinal(track.status)) {
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", t("hide")); x.onclick = dropTrack;
    top.appendChild(x);
  }
  box.appendChild(top);
  if (track.status === "cancelled") {
    const c = document.createElement("div"); c.style.marginTop = "6px"; c.textContent = stepLabel("cancelled");
    box.appendChild(c);
    return;
  }
  const ol = document.createElement("ol");
  const at = STEPS.indexOf(track.status);
  STEPS.forEach((key, i) => {
    const li = document.createElement("li");
    li.textContent = stepLabel(key);
    li.className = i < at ? "done" : i === at ? "now" : "";
    if (i === at) li.setAttribute("aria-current", "step");
    ol.appendChild(li);
  });
  box.appendChild(ol);
}

function change(id, name, price, delta, ar) {
  const l = cart[id] || (cart[id] = { name, ar, price, qty: 0 });
  l.qty += delta;
  if (l.qty <= 0) delete cart[id];
  pending = null; view = "order"; sendError = "";   // the order changed, so any earlier WhatsApp message is out of date
  saveCart();
  render();
}

// ---- Render ----
function render() {
  if (!tab) return;   // menu.json not loaded yet
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("title").textContent = t("title");
  $("lang").textContent = t("lang");
  $("table").textContent = tableNo ? `${t("table")} ${tableNo}` : "";
  renderBanner();
  renderTrack();
  const open = wasOpen;

  $("tabs").innerHTML = "";
  $("tabs").setAttribute("aria-label", t("menus"));
  $("chips").setAttribute("aria-label", t("sections"));
  const tabs = Object.entries(MENUS).map(([key, m]) => [key, lang === "ar" ? m.ar : key]);
  if (hasOffers()) tabs.push([OFFERS, t("offers")]);
  for (const [key, label] of tabs) {
    const b = document.createElement("button");
    b.textContent = label;
    b.type = "button";
    b.className = key === tab ? "active" : "";
    b.setAttribute("aria-pressed", String(key === tab));
    b.onclick = () => { tab = key; history.replaceState(null, "", "#" + encodeURIComponent(key)); render(); };
    $("tabs").appendChild(b);
  }

  const menu = $("menu");
  menu.innerHTML = "";
  const groups = [];   // every section shown, for the shortcut chips under the tabs
  if (tab === OFFERS) renderBundles(menu, open, groups);
  for (const sec of sectionsFor(tab)) {
    const shown = sec.items.filter(it => !it.hidden);   // hidden items never reach customers
    if (!shown.length) continue;
    const grid = section(menu, sec[lang] || sec.en, groups);
    for (const it of shown) {
      const price = finalPrice(it);
      const name = lang === "ar" && it.ar ? it.ar : it.en;
      const qty = cart[it.id] ? cart[it.id].qty : 0;
      const badges = [];
      if (it.isNew) badges.push(["new", t("new")]);
      if (it.discount > 0) badges.push(["off", `-${fmtNum(it.discount)}%`]);
      grid.appendChild(menuCard({
        name, desc: lang === "ar" ? it.dAr : it.dEn, pic: it.pic, badges,
        now: money(price), was: it.discount > 0 ? money(it.price) : "",
        unavailable: it.soldOut, overlay: it.soldOut ? t("soldOut") : "",
        control: buyControl(name, qty, it.soldOut || (!open && !qty), d => change(it.id, it.en, price, d, it.ar)),
      }));
    }
  }

  const chips = $("chips");
  chips.innerHTML = "";
  chips.hidden = groups.length < 2;
  for (const g of groups) {
    const b = el("button", "", g.label);
    b.type = "button";
    b.onclick = () => { g.h.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); g.h.focus({ preventScroll: true }); };
    chips.appendChild(b);
  }

  const { count, sum } = totals();
  const bar = $("bar");
  bar.hidden = !count;
  $("barQty").textContent = fmtNum(count);
  $("barCount").textContent = t("cart");
  $("barTotal").textContent = money(sum);
  if (count !== lastCount && lastCount !== null) { bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump"); }   // a small nudge when the order changes
  lastCount = count;
  if ($("sheet").style.display === "flex") renderSheet();
}

let lastCount = null;

// A titled block of cards. Returns the grid the cards go into.
function section(menu, label, groups) {
  const s = el("section", "sec");
  const h = el("h2", "", label);
  h.id = "sec-" + groups.length;
  h.tabIndex = -1;
  const grid = el("div", "grid");
  s.append(h, grid);
  menu.appendChild(s);
  groups.push({ h, label });
  return grid;
}

// One menu card, used for items and combo offers alike.
function menuCard({ name, desc, sub, pic, badges = [], now, was, unavailable, overlay, control, combo }) {
  const card = el("article", "card" + (combo ? " combo" : "") + (unavailable ? " soldout" : ""));
  const pc = picture(pic);
  if (overlay) pc.appendChild(el("span", "ovl", overlay));
  const body = el("div", "body");
  const h = el("h3", "name", name);
  for (const [cls, text] of badges) h.appendChild(el("span", "badge " + cls, text));
  body.appendChild(h);
  if (sub) body.appendChild(el("p", "sub", sub));
  if (desc) body.appendChild(el("p", "desc", desc));
  const foot = el("div", "foot");
  const price = el("div", "price");
  price.appendChild(el("span", "now", now));
  if (was) price.appendChild(el("s", "was", was));
  foot.append(price, control);
  body.appendChild(foot);
  card.append(pc, body);
  return card;
}

// "+ Add" while none are in the order, then a  − n +  stepper. step(+1 / -1) changes the order.
function buyControl(label, qty, disabled, step) {
  if (qty && !disabled) {
    const q = el("div", "qty");
    const minus = el("button", "", "−"); minus.type = "button"; minus.setAttribute("aria-label", `${t("remove")}: ${label}`); minus.onclick = () => step(-1);
    const n = el("span", "n", fmtNum(qty));
    const plus = el("button", "", "+"); plus.type = "button"; plus.setAttribute("aria-label", `${t("add")}: ${label}`); plus.onclick = () => step(1);
    q.append(minus, n, plus);
    return q;
  }
  const a = el("button", "add");
  a.type = "button";
  a.append(el("span", "", "+"), t("add"));
  a.firstChild.setAttribute("aria-hidden", "true");
  a.setAttribute("aria-label", `${t("add")}: ${label}`);
  a.disabled = disabled;
  if (!disabled) a.onclick = () => step(1);
  return a;
}

function renderBundles(menu, open, groups) {
  const list = visibleBundles();
  if (!list.length) return;
  const grid = section(menu, t("combos"), groups);
  for (const b of list) {
    const id = "b:" + b.id;
    const name = lang === "ar" && b.ar ? b.ar : b.en;
    const avail = bundleAvailable(b), saving = bundleSaving(b), regular = bundleRegular(b);
    const qty = cart[id] ? cart[id].qty : 0;
    const badges = [];
    if (b.isNew) badges.push(["new", t("new")]);
    if (saving > 0) badges.push(["off", `${t("save")} ${money(saving)}`]);
    grid.appendChild(menuCard({
      name, combo: true, pic: b.pic || "🎁", badges,
      sub: `${t("includes")}: ${bundleParts(b, lang)}`, desc: lang === "ar" ? b.dAr : b.dEn,
      now: money(b.price), was: saving > 0 ? money(regular) : "",
      unavailable: !avail, overlay: avail ? "" : t("unavailable"),
      control: buyControl(name, qty, !avail || (!open && !qty), d => change(id, b.en, b.price, d, b.ar || b.en)),
    }));
  }
}

function renderSheet() {
  if (view === "confirm" && pending) return renderConfirm();
  if (view === "done" && pending) return renderDone();
  view = "order";
  const panel = $("panel");
  panel.innerHTML = "";
  panel.setAttribute("aria-label", t("order"));
  panel.appendChild(sheetHead(t("order")));
  const { count, sum } = totals();
  if (!count) { const e = document.createElement("p"); e.textContent = t("empty"); panel.appendChild(e); }
  for (const [id, l] of Object.entries(cart)) {
    const line = document.createElement("div");
    line.className = "line";
    const top = document.createElement("div");
    top.className = "linetop";
    const nm = document.createElement("span"); nm.textContent = lang === "ar" ? l.ar : l.name;
    const q = document.createElement("div"); q.className = "qty";
    const label = lang === "ar" ? l.ar : l.name;
    const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", `${t("remove")}: ${label}`); minus.onclick = () => change(id, l.name, l.price, -1, l.ar);
    const n = document.createElement("span"); n.className = "n"; n.textContent = fmtNum(l.qty);
    const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", `${t("add")}: ${label}`); plus.onclick = () => change(id, l.name, l.price, 1, l.ar);
    q.append(minus, n, plus);
    const pr = document.createElement("span"); pr.textContent = money(l.qty * l.price);
    top.append(nm, q, pr);
    const note = document.createElement("input");
    note.placeholder = t("itemNote");
    note.setAttribute("aria-label", `${t("itemNote")}: ${label}`);
    note.value = l.note || "";
    note.oninput = () => { l.note = note.value; saveCart(); };
    line.append(top);
    if (id.startsWith("b:")) {   // a combo: say what is in it
      const b = BUNDLES.find(x => "b:" + x.id === id);
      if (b) { const sub = document.createElement("small"); sub.className = "parts"; sub.textContent = bundleParts(b, lang); line.append(sub); }
    }
    line.append(note);
    panel.appendChild(line);
  }
  if (count) {
    const fee = deliveryFee(sum);
    const tot = document.createElement("div"); tot.className = "total";
    tot.innerHTML = "<span></span><span></span>";
    tot.children[0].textContent = t("total"); tot.children[1].textContent = money(sum + fee);
    let feeRow = null;
    if (order.type === "delivery") {
      feeRow = document.createElement("div"); feeRow.className = "linetop"; feeRow.style.padding = "8px 0";
      feeRow.innerHTML = "<span></span><span></span>";
      const needsArea = (SETTINGS.deliveryAreas || []).length && !SETTINGS.deliveryAreas[order.area];
      feeRow.children[0].textContent = t("fee"); feeRow.children[1].textContent = needsArea ? "-" : fee ? money(fee) : t("free");
    }
    const types = document.createElement("div"); types.className = "types";
    for (const key of ["dinein", "takeaway", "delivery"]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t(key);
      b.className = order.type === key ? "active" : "";
      b.setAttribute("aria-pressed", String(order.type === key));
      b.onclick = () => { order.type = key; renderSheet(); };
      types.appendChild(b);
    }
    const field = (key, ph, extra = {}) => {
      const el = document.createElement("input");
      el.placeholder = ph; el.value = order[key];
      el.setAttribute("aria-label", ph);
      Object.assign(el, extra);
      el.oninput = () => { order[key] = el.value; el.classList.remove("bad"); };
      el.dataset.field = key;
      return el;
    };
    const fields = [field("name", t("name"), { autocomplete: "name" })];
    if (order.type === "dinein") fields.push(field("table", t("tableNo"), { inputMode: "numeric" }));
    if (order.type === "delivery") {
      fields.push(field("phone", t("phone"), { inputMode: "tel", autocomplete: "tel" }));
      const areas = SETTINGS.deliveryAreas || [];
      if (areas.length) {
        const sel = document.createElement("select");
        sel.dataset.field = "area";
        sel.setAttribute("aria-label", t("area"));
        const ph = document.createElement("option"); ph.value = ""; ph.textContent = t("pickArea"); sel.appendChild(ph);
        areas.forEach((a, i) => {
          const o = document.createElement("option");
          o.value = String(i);
          o.textContent = `${lang === "ar" && a.ar ? a.ar : a.en} (${money(Number(a.fee) || 0)})`;
          sel.appendChild(o);
        });
        sel.value = order.area;
        sel.onchange = () => { order.area = sel.value; renderSheet(); };
        fields.push(sel);
      }
      fields.push(field("address", t("address"), { autocomplete: "street-address" }));
    }
    const ni = document.createElement("textarea"); ni.placeholder = t("note"); ni.rows = 2; ni.value = order.note;
    ni.setAttribute("aria-label", t("note"));
    ni.oninput = () => { order.note = ni.value; };

    // Things that stop the order from being sent right now
    const notes = [];
    const minOrder = Number(SETTINGS.minDeliveryOrder) || 0;
    const open = openStatus();
    if (!open.open) notes.push(open.paused ? t("paused") : t("closed"));
    if (order.type === "delivery" && minOrder > 0 && sum < minOrder) notes.push(`${t("minOrder")} ${money(minOrder)}`);
    const send = document.createElement("button"); send.className = "send"; send.textContent = t("send");
    send.disabled = notes.length > 0 || sending;
    send.onclick = sendOrder;
    // How much the customer saves through combo offers
    let saved = 0;
    for (const [id, l] of Object.entries(cart)) {
      const b = id.startsWith("b:") ? BUNDLES.find(x => "b:" + x.id === id) : null;
      if (b) saved += bundleSaving(b) * l.qty;
    }
    saved = round2(saved);
    let saveRow = null;
    if (saved > 0) {
      saveRow = document.createElement("div"); saveRow.className = "linetop saving"; saveRow.style.padding = "8px 0";
      saveRow.innerHTML = "<span></span><span></span>";
      saveRow.children[0].textContent = t("youSave"); saveRow.children[1].textContent = money(saved);
    }
    // Totals in one box: subtotal (only when something is added or taken off), delivery fee, combo savings, total
    const summary = el("div", "summary");
    if (feeRow || saveRow) {
      const st = el("div", "linetop");
      st.append(el("span", "", t("subtotal")), el("span", "", money(sum)));
      summary.appendChild(st);
    }
    if (feeRow) summary.appendChild(feeRow);
    if (saveRow) summary.appendChild(saveRow);
    summary.appendChild(tot);
    panel.append(el("div", "label", t("type")), types, ...fields, ni, summary);
    if (sendError) notes.push(sendError);   // shown, but does not block trying again
    for (const text of notes) { const w = document.createElement("div"); w.className = "warn"; w.textContent = text; panel.appendChild(w); }
    panel.appendChild(send);
  }
  const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = t("close");
  close.onclick = closeSheet;
  panel.appendChild(close);
}

function sheetHead(title) {
  const head = el("div", "sheet-head");
  const x = el("button", "x", "×");
  x.type = "button";
  x.setAttribute("aria-label", t("close"));
  x.onclick = closeSheet;
  head.append(el("h2", "", title), x);
  return head;
}

function openSheet() {
  $("sheet").style.display = "flex";
  document.body.classList.add("locked");
  renderSheet();
  $("panel").focus({ preventScroll: true });
}

function closeSheet() {
  $("sheet").style.display = "none";
  document.body.classList.remove("locked");
  if (!$("bar").hidden) $("bar").focus({ preventScroll: true });
}

// Short order number so the customer and the kitchen can refer to the same order.
// Digits only: seconds since the epoch (repeats every ~2.8 hours) plus two random digits.
const newOrderId = () => {
  const a = String(Math.floor(Date.now() / 1000) % 10000).padStart(4, "0");
  const b = String(Math.floor(Math.random() * 100)).padStart(2, "0");
  return a + b;
};

function flagBad(selector) {
  const el = document.querySelector(selector);
  if (el) { el.classList.add("bad"); el.focus(); }
}

// Saves the order on the backend. Returns { id, token }, null if the server is unreachable (the order then goes by WhatsApp only),
// or throws an Error with a message when the server refuses the order.
async function saveOrderOnServer() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);   // a sleeping free server can take a while to wake up
  try {
    const res = await fetch(API_URL + "/api/orders", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({
        type: order.type, name: order.name.trim(), table: order.table.trim(), phone: order.phone.trim(),
        area: order.area, address: order.address.trim(), note: order.note.trim(),
        items: Object.entries(cart).map(([id, l]) => ({ id, qty: l.qty, note: l.note || "" })),
      }),
    });
    const out = await res.json().catch(() => ({}));
    if (res.ok && out.number) return { id: String(out.number), token: out.token };
    if (res.status >= 400 && res.status < 500) throw new Error(out.error || "The order could not be saved");
    return null;
  } catch (e) {
    if (e.name === "AbortError" || e instanceof TypeError) return null;   // offline or timed out
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function sendOrder() {
  // The message is always written in English so the kitchen can read it whatever language the customer used.
  const { sum } = totals();
  if (sending) return;
  if (!openStatus().open) { renderSheet(); return; }
  if (order.name.trim().length < 2) return flagBad('#panel [data-field="name"]');
  if (order.type === "dinein" && !order.table.trim()) return flagBad('#panel [data-field="table"]');
  if (order.type === "delivery") {
    if (!validPhone(order.phone)) return flagBad('#panel [data-field="phone"]');
    if ((SETTINGS.deliveryAreas || []).length && !SETTINGS.deliveryAreas[order.area]) return flagBad('#panel [data-field="area"]');
    if (!order.address.trim()) return flagBad('#panel [data-field="address"]');
  }
  let id = newOrderId();
  let win = null, stored = null;
  if (API_URL) {
    win = window.open("", "_blank");   // opened now, filled in later, so the popup blocker still allows it
    sending = true; sendError = ""; renderSheet();
    try {
      stored = await saveOrderOnServer();
      if (stored) id = stored.id;
    } catch (e) {
      if (win) win.close();
      sending = false; sendError = e.message; renderSheet();
      return;
    }
    sending = false;
  }
  const fee = deliveryFee(sum);
  const lines = [`*${UI.en.greeting} #${id}*`, `${UI.en.customer}: ${order.name.trim()}`, `${UI.en.type}: ${UI.en[order.type]}`];
  if (order.type === "dinein") lines.push(`${UI.en.table}: ${order.table.trim()}`);
  if (order.type === "delivery") {
    const area = (SETTINGS.deliveryAreas || [])[order.area];
    lines.push(`${UI.en.phone}: ${order.phone.trim()}`);
    if (area) lines.push(`${UI.en.area}: ${area.en}`);
    lines.push(`${UI.en.address}: ${order.address.trim()}`);
  }
  let saved = 0;
  for (const [cid, l] of Object.entries(cart)) {
    lines.push(`${l.qty} x ${l.name} - ${CURRENCY.en}${(l.qty * l.price).toFixed(2)}`);
    const b = cid.startsWith("b:") ? BUNDLES.find(x => "b:" + x.id === cid) : null;
    if (b) { lines.push(`   (${bundleParts(b, "en")})`); saved += bundleSaving(b) * l.qty; }
    if (l.note && l.note.trim()) lines.push(`   > ${l.note.trim()}`);
  }
  if (saved > 0) lines.push(`${UI.en.youSave}: ${CURRENCY.en}${round2(saved).toFixed(2)}`);
  if (order.type === "delivery") lines.push(`${UI.en.fee}: ${fee ? CURRENCY.en + fee.toFixed(2) : UI.en.free}`);
  lines.push(`${UI.en.total}: ${CURRENCY.en}${(sum + fee).toFixed(2)}`);
  if (order.note.trim()) lines.push(`${UI.en.note.replace(" (optional)", "")}: ${order.note.trim()}`);
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
  pending = { id, url };
  view = "confirm";
  saveCart();
  if (stored) startTrack(stored);
  if (win) win.location.href = url; else window.open(url, "_blank");
  renderSheet();
}

// The order only exists once the customer presses Send inside WhatsApp, so say so and let them re-open it.
function renderConfirm() {
  const panel = $("panel");
  panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = t("confirmTitle"); h.style.marginTop = "0"; h.className = "center";
  const no = document.createElement("div"); no.className = "ordno"; no.textContent = `${t("orderNo")} #${pending.id}`;
  const p = document.createElement("p"); p.className = "center"; p.textContent = t("confirmText");
  const again = document.createElement("button"); again.className = "send"; again.textContent = t("openAgain");
  again.onclick = () => window.open(pending.url, "_blank");
  const sent = document.createElement("button"); sent.className = "secondary"; sent.textContent = t("sent");
  sent.onclick = () => {
    for (const k of Object.keys(cart)) delete cart[k];
    store.del("cart_v1"); store.del("pending_v1");
    view = "done"; render(); renderSheet();
  };
  const back = document.createElement("button"); back.className = "close"; back.textContent = t("back");
  back.onclick = () => { pending = null; view = "order"; saveCart(); renderSheet(); };
  panel.append(h, no, p, again, sent, back);
}

function renderDone() {
  const panel = $("panel");
  panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = t("thanks"); h.style.marginTop = "0"; h.className = "center";
  const no = document.createElement("div"); no.className = "ordno"; no.textContent = `${t("orderNo")} #${pending.id}`;
  const p = document.createElement("p"); p.className = "center"; p.textContent = t("keep");
  const ok = document.createElement("button"); ok.className = "send"; ok.textContent = t("done");
  ok.onclick = () => { pending = null; view = "order"; closeSheet(); render(); };
  panel.append(h, no, p, ok);
}

$("lang").onclick = () => { lang = lang === "en" ? "ar" : "en"; store.set("lang", lang); render(); };
$("bar").onclick = openSheet;
$("sheet").onclick = e => { if (e.target === $("sheet")) closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("sheet").style.display === "flex") closeSheet(); });

async function init() {
  try {
    let data = null;
    if (API_URL) {   // backend first; if it is asleep or down, fall back to menu.json
      try {
        const r = await fetch(API_URL + "/api/menu", { cache: "no-store", signal: AbortSignal.timeout(8000) });
        if (r.ok) data = await r.json();
      } catch {}
    }
    if (!data) {
      const res = await fetch("menu.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    }
    SETTINGS = data.settings || {};
    WHATSAPP_NUMBER = SETTINGS.whatsapp || "";
    CURRENCY = { en: SETTINGS.currency || "$", ar: SETTINGS.currency || "$" };
    MENUS = Object.fromEntries(data.venues.map(v => [v.key, v]));
    BUNDLES = Array.isArray(data.bundles) ? data.bundles : [];
    indexItems();
  } catch (e) {
    $("menu").innerHTML = "";
    $("menu").appendChild(el("p", "failed", UI[lang].loadError));
    return;
  }
  const wanted = decodeURIComponent(location.hash.slice(1));
  tab = MENUS[wanted] || (wanted === OFFERS && hasOffers()) ? wanted : Object.keys(MENUS)[0];
  restoreCart();
  render();
  if (view === "confirm") openSheet();   // coming back from WhatsApp
  setInterval(() => { if (openStatus().open !== wasOpen) render(); }, 30000);       // opening or closing time passed
  pollTrack(); setInterval(pollTrack, 15000);                                       // order status from the kitchen
}
init();
</script>
