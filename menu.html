<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; background: #faf7f2; color: #2b2118; padding-bottom: 80px; }
  header { padding: 16px 16px 0; text-align: center; position: relative; }
  header h1 { margin: 8px 0 0; }
  #lang { position: absolute; top: 12px; inset-inline-end: 12px; padding: 6px 12px; border: 1px solid #c9bba8; border-radius: 8px; background: #fff; cursor: pointer; }
  #table { color: #7a6a58; font-size: 14px; margin-top: 4px; }
  nav { display: flex; gap: 8px; justify-content: center; padding: 16px; }
  nav button { padding: 10px 20px; border: 0; border-radius: 999px; background: #e8dfd3; font-size: 16px; cursor: pointer; }
  nav button.active { background: #6b3f1d; color: #fff; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  h2 { border-bottom: 2px solid #6b3f1d; padding-bottom: 4px; margin-top: 28px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dotted #c9bba8; }
  .pic { flex: none; width: 64px; height: 64px; border-radius: 12px; background: #efe5d6; display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; }
  .info small { display: block; color: #7a6a58; }
  .price { white-space: nowrap; font-weight: 600; }
  .soldout .pic { opacity: .45; }
  .soldout .info { color: #9a8a78; }
  .badge.out { background: #5b4a3a; }
  .sold { padding: 4px 10px; border-radius: 8px; background: #e8dfd3; color: #7a6a58; font-size: 13px; font-weight: 600; }
  .was { display: block; color: #9a8a78; font-weight: 400; font-size: 13px; }
  .badge { display: inline-block; margin-inline-start: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; vertical-align: middle; }
  .badge.new { background: #1fa855; }
  .badge.off { background: #c0392b; }
  .buy { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button, .add { border: 0; border-radius: 8px; background: #6b3f1d; color: #fff; font-size: 16px; min-width: 32px; height: 32px; cursor: pointer; }
  .add { padding: 0 12px; }
  #bar { position: fixed; inset-inline: 0; bottom: 0; padding: 12px 16px; background: #6b3f1d; color: #fff; display: none; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
  #sheet .panel { background: #faf7f2; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; box-sizing: border-box; }
  .line { padding: 8px 0; border-bottom: 1px dotted #c9bba8; }
  .linetop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .linetop > span:first-child { flex: 1; }
  .line input { font-size: 14px; padding: 6px 8px; }
  .panel input, .panel textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; font-size: 16px; border: 1px solid #c9bba8; border-radius: 8px; }
  .types { display: flex; gap: 6px; margin-bottom: 8px; }
  .types button { flex: 1; padding: 10px 4px; border: 1px solid #c9bba8; border-radius: 8px; background: #fff; font-size: 15px; cursor: pointer; }
  .types button.active { background: #6b3f1d; color: #fff; border-color: #6b3f1d; }
  .panel input.bad { border-color: #c0392b; background: #fdecea; }
  .total { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; margin: 12px 0; }
  .send { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #1fa855; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  .close { background: none; border: 0; font-size: 15px; color: #7a6a58; cursor: pointer; width: 100%; padding: 10px; }
</style>
</head>
<body>
<header>
  <button id="lang"></button>
  <h1 id="title"></h1>
  <div id="table"></div>
</header>
<nav id="tabs"></nav>
<main id="menu"></main>
<div id="bar"><span id="barCount"></span><span id="barTotal"></span></div>
<div id="sheet"><div class="panel" id="panel"></div></div>
<script>
// ---- Settings ----
// Overwritten from menu.json "settings" (editable in admin.html).
let WHATSAPP_NUMBER = "";   // Counter/kitchen WhatsApp, digits only with country code. Empty = customer picks the contact.
let CURRENCY = { en: "$", ar: "$" };
let DELIVERY_FEE = 0;       // Added to the total for delivery orders.
const OFFERS = "__offers";  // Virtual tab listing every discounted item.

const UI = {
  en: { title: "Our Menu", table: "Table", add: "Add", offers: "Special offers", new: "NEW", soldOut: "Sold out", cart: "View order", order: "Your order", tableNo: "Table number", type: "Order type", dinein: "Dine in", takeaway: "Takeaway", delivery: "Delivery", fee: "Delivery fee", phone: "Phone number", address: "Delivery address", note: "Notes (optional)", itemNote: "Changes for this item (e.g. no onions)", total: "Total", send: "Send order via WhatsApp", close: "Keep browsing", empty: "Your order is empty", greeting: "New order", lang: "العربية" },
  ar: { title: "قائمة الطعام", table: "طاولة", add: "أضف", offers: "العروض", new: "جديد", soldOut: "نفدت الكمية", cart: "عرض الطلب", order: "طلبك", tableNo: "رقم الطاولة", type: "نوع الطلب", dinein: "في المطعم", takeaway: "سفري", delivery: "توصيل", fee: "رسوم التوصيل", phone: "رقم الهاتف", address: "عنوان التوصيل", note: "ملاحظات (اختياري)", itemNote: "تعديلات على هذا الصنف (مثال: بدون بصل)", total: "الإجمالي", send: "إرسال الطلب عبر واتساب", close: "متابعة التصفح", empty: "طلبك فارغ", greeting: "طلب جديد", lang: "English" }
};

// Menu content comes from menu.json (edited through admin.html).
// Item: { id, en, ar, dEn, dAr, price, discount (percent), pic, isNew }. pic is an emoji, or an image path/URL.
let MENUS = {};

// ---- State ----
const params = new URLSearchParams(location.search);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let lang = params.get("lang") || store.get("lang") || "en";
if (!UI[lang]) lang = "en";
let tab = "";
let tableNo = params.get("table") || "";
// How the customer wants the order served; a table QR defaults to dine-in.
const order = { type: tableNo ? "dinein" : "takeaway", table: tableNo, phone: "", address: "", note: "" };
const cart = {};   // id -> { name, price, qty }

const $ = id => document.getElementById(id);
const t = k => UI[lang][k];
const money = n => CURRENCY[lang] + n.toFixed(2);
const fmtNum = n => lang === "ar" ? String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(n);

function totals() {
  let count = 0, sum = 0;
  for (const l of Object.values(cart)) { count += l.qty; sum += l.qty * l.price; }
  return { count, sum };
}

function picture(src) {
  const pic = document.createElement("div");
  pic.className = "pic";
  if (/[\/.]/.test(src)) {
    const img = document.createElement("img");
    img.src = src; img.alt = ""; img.loading = "lazy";
    pic.appendChild(img);
  } else pic.textContent = src;
  return pic;
}

const finalPrice = it => Math.round(it.price * (100 - (it.discount || 0))) / 100;

function sectionsFor(key) {
  if (key !== OFFERS) return MENUS[key].sections;
  return Object.entries(MENUS)
    .map(([k, m]) => ({ en: k, ar: m.ar, items: m.sections.flatMap(s => s.items).filter(it => it.discount > 0 && !it.hidden) }))
    .filter(s => s.items.length);
}

const hasOffers = () => sectionsFor(OFFERS).length > 0;

function change(id, name, price, delta, ar) {
  const l = cart[id] || (cart[id] = { name, ar, price, qty: 0 });
  l.qty += delta;
  if (l.qty <= 0) delete cart[id];
  render();
}

// ---- Render ----
function render() {
  if (!tab) return;   // menu.json not loaded yet
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("title").textContent = t("title");
  $("lang").textContent = t("lang");
  $("table").textContent = tableNo ? `${t("table")} ${tableNo}` : "";

  $("tabs").innerHTML = "";
  const tabs = Object.entries(MENUS).map(([key, m]) => [key, lang === "ar" ? m.ar : key]);
  if (hasOffers()) tabs.push([OFFERS, t("offers")]);
  for (const [key, label] of tabs) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = key === tab ? "active" : "";
    b.onclick = () => { tab = key; history.replaceState(null, "", "#" + encodeURIComponent(key)); render(); };
    $("tabs").appendChild(b);
  }

  const menu = $("menu");
  menu.innerHTML = "";
  for (const sec of sectionsFor(tab)) {
    const shown = sec.items.filter(it => !it.hidden);   // hidden items never reach customers
    if (!shown.length) continue;
    const h = document.createElement("h2");
    h.textContent = sec[lang];
    menu.appendChild(h);
    for (const it of shown) {
      const { id, en, ar, pic } = it;
      const price = finalPrice(it);
      const name = lang === "ar" ? ar : en;
      const desc = lang === "ar" ? it.dAr : it.dEn;
      const row = document.createElement("div");
      row.className = "item" + (it.soldOut ? " soldout" : "");
      const info = document.createElement("div");
      info.className = "info";
      info.textContent = name;
      if (it.soldOut) { const ob = document.createElement("span"); ob.className = "badge out"; ob.textContent = t("soldOut"); info.appendChild(ob); }
      if (it.isNew) { const nb = document.createElement("span"); nb.className = "badge new"; nb.textContent = t("new"); info.appendChild(nb); }
      if (it.discount > 0) { const db = document.createElement("span"); db.className = "badge off"; db.textContent = `-${fmtNum(it.discount)}%`; info.appendChild(db); }
      if (desc) { const s = document.createElement("small"); s.textContent = desc; info.appendChild(s); }
      const buy = document.createElement("div");
      buy.className = "buy";
      const p = document.createElement("div");
      p.className = "price";
      if (it.discount > 0) { const old = document.createElement("s"); old.className = "was"; old.textContent = money(it.price); p.appendChild(old); }
      p.appendChild(document.createTextNode(money(price)));
      buy.appendChild(p);
      const qty = cart[id] ? cart[id].qty : 0;
      if (it.soldOut) {
        const so = document.createElement("div");
        so.className = "sold"; so.textContent = t("soldOut");
        buy.appendChild(so);
      } else if (qty) {
        const q = document.createElement("div");
        q.className = "qty";
        const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = () => change(id, en, price, -1, ar);
        const n = document.createElement("span"); n.textContent = fmtNum(qty);
        const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = () => change(id, en, price, 1, ar);
        q.append(minus, n, plus);
        buy.appendChild(q);
      } else {
        const a = document.createElement("button");
        a.className = "add"; a.textContent = t("add");
        a.onclick = () => change(id, en, price, 1, ar);
        buy.appendChild(a);
      }
      row.append(picture(pic), info, buy);
      menu.appendChild(row);
    }
  }

  const { count, sum } = totals();
  $("bar").style.display = count ? "flex" : "none";
  $("barCount").textContent = `${t("cart")} (${fmtNum(count)})`;
  $("barTotal").textContent = money(sum);
  if ($("sheet").style.display === "flex") renderSheet();
}

function renderSheet() {
  const panel = $("panel");
  panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = t("order"); h.style.marginTop = "0";
  panel.appendChild(h);
  const { count, sum } = totals();
  if (!count) { const e = document.createElement("p"); e.textContent = t("empty"); panel.appendChild(e); }
  for (const [id, l] of Object.entries(cart)) {
    const line = document.createElement("div");
    line.className = "line";
    const top = document.createElement("div");
    top.className = "linetop";
    const nm = document.createElement("span"); nm.textContent = lang === "ar" ? l.ar : l.name;
    const q = document.createElement("div"); q.className = "qty";
    const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = () => change(id, l.name, l.price, -1, l.ar);
    const n = document.createElement("span"); n.textContent = fmtNum(l.qty);
    const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = () => change(id, l.name, l.price, 1, l.ar);
    q.append(minus, n, plus);
    const pr = document.createElement("span"); pr.textContent = money(l.qty * l.price);
    top.append(nm, q, pr);
    const note = document.createElement("input");
    note.placeholder = t("itemNote");
    note.value = l.note || "";
    note.oninput = () => { l.note = note.value; };
    line.append(top, note);
    panel.appendChild(line);
  }
  if (count) {
    const tot = document.createElement("div"); tot.className = "total";
    tot.innerHTML = "<span></span><span></span>";
    const fee = order.type === "delivery" ? DELIVERY_FEE : 0;
    tot.children[0].textContent = t("total"); tot.children[1].textContent = money(sum + fee);
    let feeRow = null;
    if (fee) {
      feeRow = document.createElement("div"); feeRow.className = "linetop"; feeRow.style.padding = "8px 0";
      feeRow.innerHTML = "<span></span><span></span>";
      feeRow.children[0].textContent = t("fee"); feeRow.children[1].textContent = money(fee);
    }
    const types = document.createElement("div"); types.className = "types";
    for (const key of ["dinein", "takeaway", "delivery"]) {
      const b = document.createElement("button");
      b.textContent = t(key);
      b.className = order.type === key ? "active" : "";
      b.onclick = () => { order.type = key; renderSheet(); };
      types.appendChild(b);
    }
    const field = (key, ph, extra = {}) => {
      const el = document.createElement("input");
      el.placeholder = ph; el.value = order[key];
      Object.assign(el, extra);
      el.oninput = () => { order[key] = el.value; el.classList.remove("bad"); };
      el.dataset.field = key;
      return el;
    };
    const fields = [];
    if (order.type === "dinein") fields.push(field("table", t("tableNo"), { inputMode: "numeric" }));
    if (order.type === "delivery") {
      fields.push(field("phone", t("phone"), { inputMode: "tel" }));
      fields.push(field("address", t("address")));
    }
    const ni = document.createElement("textarea"); ni.placeholder = t("note"); ni.rows = 2; ni.value = order.note;
    ni.oninput = () => { order.note = ni.value; };
    const send = document.createElement("button"); send.className = "send"; send.textContent = t("send");
    send.onclick = sendOrder;
    panel.append(types, ...fields, ni, ...(feeRow ? [feeRow] : []), tot, send);
  }
  const close = document.createElement("button"); close.className = "close"; close.textContent = t("close");
  close.onclick = () => { $("sheet").style.display = "none"; };
  panel.appendChild(close);
}

function sendOrder() {
  // The message is always written in English so the kitchen can read it whatever language the customer used.
  const { sum } = totals();
  const required = { dinein: ["table"], takeaway: [], delivery: ["phone", "address"] }[order.type];
  const missing = required.find(k => !order[k].trim());
  if (missing) {
    const el = document.querySelector(`#panel [data-field="${missing}"]`);
    el.classList.add("bad"); el.focus();
    return;
  }
  const note = order.note.trim();
  const lines = [`*${UI.en.greeting}*`, `${UI.en.type}: ${UI.en[order.type]}`];
  if (order.type === "dinein") lines.push(`${UI.en.table}: ${order.table.trim()}`);
  if (order.type === "delivery") lines.push(`${UI.en.phone}: ${order.phone.trim()}`, `${UI.en.address}: ${order.address.trim()}`);
  for (const l of Object.values(cart)) {
    lines.push(`${l.qty} x ${l.name} - ${CURRENCY.en}${(l.qty * l.price).toFixed(2)}`);
    if (l.note && l.note.trim()) lines.push(`   > ${l.note.trim()}`);
  }
  const fee = order.type === "delivery" ? DELIVERY_FEE : 0;
  if (fee) lines.push(`${UI.en.fee}: ${CURRENCY.en}${fee.toFixed(2)}`);
  lines.push(`${UI.en.total}: ${CURRENCY.en}${(sum + fee).toFixed(2)}`);
  if (note) lines.push(`${UI.en.note.replace(" (optional)", "")}: ${note}`);
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
  window.open(url, "_blank");
}

$("lang").onclick = () => { lang = lang === "en" ? "ar" : "en"; store.set("lang", lang); render(); };
$("bar").onclick = () => { $("sheet").style.display = "flex"; renderSheet(); };
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").style.display = "none"; };

async function init() {
  try {
    const res = await fetch("menu.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const s = data.settings || {};
    WHATSAPP_NUMBER = s.whatsapp || "";
    CURRENCY = { en: s.currency || "$", ar: s.currency || "$" };
    DELIVERY_FEE = Number(s.deliveryFee) || 0;
    MENUS = Object.fromEntries(data.venues.map(v => [v.key, v]));
  } catch (e) {
    $("menu").textContent = "Could not load the menu. Please refresh.";
    return;
  }
  const wanted = decodeURIComponent(location.hash.slice(1));
  tab = MENUS[wanted] || (wanted === OFFERS && hasOffers()) ? wanted : Object.keys(MENUS)[0];
  render();
}
init();
</script>
</body>
</html>
